<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>KickSense — Test Predict</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --ok: #4ade80;
      --err: #f87171;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, Segoe UI, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 24px;
    }
    .wrap { max-width: 720px; margin: 0 auto; }
    h1 { margin: 0 0 8px; font-size: 1.6rem; }
    p { color: var(--muted); margin: 0 0 20px; }
    .card {
      background: var(--card);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 16px;
    }
    input[type="file"] { width: 100%; margin: 12px 0; color: var(--text); }
    button {
      background: var(--accent);
      color: #0f172a;
      border: 0;
      border-radius: 8px;
      padding: 12px 20px;
      font-weight: 700;
      cursor: pointer;
      width: 100%;
      font-size: 1rem;
    }
    button:disabled { opacity: 0.5; cursor: wait; }
    .status { margin-top: 12px; color: var(--muted); min-height: 1.4em; }
    .status.err { color: var(--err); }
    .metrics {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 12px;
      margin-top: 8px;
    }
    .metric {
      background: #0f172a;
      border-radius: 10px;
      padding: 14px;
      text-align: center;
    }
    .metric .label { color: var(--muted); font-size: 0.8rem; }
    .metric .value { font-size: 1.4rem; font-weight: 700; margin-top: 6px; color: var(--ok); }
    .skeletons { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 12px; }
    .skeletons img {
      max-width: 100%;
      width: 320px;
      border-radius: 8px;
      background: #000;
    }
    code { color: var(--accent); }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>KickSense — Test Predict</h1>
    <p>
      Use this page instead of Swagger if results are hard to see.
      API must be running at <code>http://127.0.0.1:8000</code>
    </p>

    <div class="card">
      <label for="file"><strong>1. Choose a penalty video (.mp4)</strong></label>
      <input id="file" type="file" accept=".mp4,.avi,.mov,video/*" />
      <button id="btn" type="button">2. Analyze</button>
      <div id="status" class="status"></div>
    </div>

    <div class="card" id="results" hidden>
      <h2 style="margin-top:0">Results</h2>
      <div class="metrics">
        <div class="metric">
          <div class="label">Direction</div>
          <div class="value" id="direction">—</div>
        </div>
        <div class="metric">
          <div class="label">Confidence</div>
          <div class="value" id="confidence">—</div>
        </div>
        <div class="metric">
          <div class="label">Power</div>
          <div class="value" id="power">—</div>
        </div>
      </div>
      <p style="margin:16px 0 8px;color:var(--muted)">Skeleton (pose)</p>
      <div class="skeletons" id="skeletons"></div>
    </div>
  </div>

  <script>
    const API = "http://127.0.0.1:8000";
    const btn = document.getElementById("btn");
    const statusEl = document.getElementById("status");
    const results = document.getElementById("results");

    btn.addEventListener("click", async () => {
      const fileInput = document.getElementById("file");
      const file = fileInput.files[0];
      if (!file) {
        statusEl.textContent = "Please choose a video file first.";
        statusEl.className = "status err";
        return;
      }

      btn.disabled = true;
      results.hidden = true;
      statusEl.className = "status";
      statusEl.textContent = "Uploading and analyzing… this can take 30–90 seconds. Wait.";

      const form = new FormData();
      form.append("file", file);

      try {
        const res = await fetch(API + "/predict", { method: "POST", body: form });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
          throw new Error(data.detail || ("HTTP " + res.status));
        }

        document.getElementById("direction").textContent = data.direction;
        document.getElementById("confidence").textContent =
          (data.direction_confidence * 100).toFixed(1) + "%";
        document.getElementById("power").textContent = data.power;

        const sk = document.getElementById("skeletons");
        sk.innerHTML = "";
        (data.skeleton_images_base64 || []).forEach((b64) => {
          const img = document.createElement("img");
          img.src = "data:image/jpeg;base64," + b64;
          img.alt = "Pose skeleton";
          sk.appendChild(img);
        });

        results.hidden = false;
        statusEl.textContent = "Done.";
      } catch (err) {
        statusEl.className = "status err";
        statusEl.textContent =
          "Failed: " + err.message +
          " — Is the server running? Open http://127.0.0.1:8000/health";
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
